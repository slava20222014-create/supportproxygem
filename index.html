<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support ProxyGem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(30, 30, 30, 0.8) 0%, #000000 90%);
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            padding: 48px 32px;
            transition: all 0.4s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
            animation: cardAppear 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            border-color: #3a3a3a;
            transform: translateY(-5px);
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 1);
        }

        .tea-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, #aaaaaa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards 0.2s;
        }

        .price {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 32px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards 0.35s;
        }

        .avatar-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            opacity: 0;
            transform: scale(0.8);
            animation: scaleIn 0.5s ease forwards 0.5s;
        }

        @keyframes scaleIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            background: #1a1a1a;
        }

        .card:hover .avatar {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255,255,255,0.4);
            border-color: #f0f0f0;
        }

        .nick {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #cccccc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards 0.65s;
        }

        .role {
            font-size: 1rem;
            color: #aaaaaa;
            font-weight: 500;
            letter-spacing: 0.5px;
            border-top: 1px solid #2a2a2a;
            display: inline-block;
            padding-top: 12px;
            margin-top: 8px;
            margin-bottom: 28px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards 0.8s;
        }

        .qr-section {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards 0.95s;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .qr-label {
            color: #6a6a6a;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .qr-code {
            background: white;
            padding: 12px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            /* Убираем подсказку при наведении */
            cursor: default;
            pointer-events: none;
        }

        /* Отключаем любые всплывающие подсказки */
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            pointer-events: none;
        }

        .scan-text {
            margin-top: 16px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: 1px;
            background: rgba(255,255,255,0.05);
            display: inline-block;
            padding: 8px 18px;
            border-radius: 40px;
        }

        @media (max-width: 550px) {
            .card {
                padding: 36px 24px;
            }
            .avatar {
                width: 110px;
                height: 110px;
            }
            .nick {
                font-size: 1.9rem;
            }
            .tea-title {
                font-size: 1.6rem;
            }
            .price {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="tea-title">АВТОРУ НА ЧАЙ</div>
            <div class="price">100 РУБ</div>

            <div class="avatar-wrapper">
                <img class="avatar" 
                     src="https://cdn.discordapp.com/attachments/1291442583033348119/1504221148341342441/gemer.png?ex=6a06329c&is=6a04e11c&hm=925005f1e3f2bae7df314c13dc069e14a9f8f39cae4a86b1ca9c624c13d4e431&" 
                     alt="Gemer avatar"
                     onerror="this.src='https://placehold.co/200x200/1a1a1a/ffffff?text=Gemer'">
            </div>
            <div class="nick">Gemer</div>
            <div class="role">Owner ProxyGem</div>
            
            <div class="qr-section">
                <div class="qr-label">ПОДДЕРЖКА</div>
                <div class="qr-code" id="qrContainer"></div>
                <div class="scan-text">ОТСКАНИРУЙ QR-КОД</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        const DONATION_URL = 'https://www.donationalerts.com/r/gemer_proxy';
        
        // Создаём QR-код без всплывающих подсказок
        const qrContainer = document.getElementById("qrContainer");
        new QRCode(qrContainer, {
            text: DONATION_URL,
            width: 128,
            height: 128,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
        
        // Дополнительно убираем title у всех canvas внутри QR-кода
        const canvases = qrContainer.querySelectorAll('canvas');
        canvases.forEach(canvas => {
            canvas.removeAttribute('title');
            canvas.setAttribute('aria-hidden', 'true');
        });
    </script>
</body>
</html>
